# Clusterfiy Nginx vhost (Ubuntu, PHP 8.3-FPM). Certbot adds the 443 block.
# Install: sudo cp deploy/nginx-clusterfiy.conf /etc/nginx/sites-available/clusterfiy
#          sudo ln -s /etc/nginx/sites-available/clusterfiy /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# HTTPS:   sudo certbot --nginx -d app.example.com
server {
    listen 80;
    server_name app.example.com;

    root /var/www/clusterfiy/public;
    index index.php;

    client_max_body_size 10m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Vite-built assets: immutable cache. index.php: never cache.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
