# Clusterfiy queue worker (database driver). Supervised, auto-restarts.
# Install: sudo cp deploy/supervisor-clusterfiy-worker.conf /etc/supervisor/conf.d/
#          sudo supervisorctl reread && sudo supervisorctl update
[program:clusterfiy-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/clusterfiy/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --max-jobs=1000
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/clusterfiy/storage/logs/worker.log
stopwaitsecs=90
stopasgroup=true
killasgroup=true
